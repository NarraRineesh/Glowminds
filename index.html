<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Glowminds — AI-Powered Career Platform for Students & Fresh Graduates</title>
    <meta name="description" content="Build ATS-optimized resumes, get AI-matched to 12,400+ daily jobs across 50+ portals, and track applications — affordable plans. The #1 career platform for students and fresh graduates in India." />
    <meta name="keywords" content="AI resume builder, job matching, student jobs, fresh graduate jobs, ATS resume, career platform, job portal India, AI career coach, application tracker, internship finder" />
    <meta name="author" content="Glowminds — KNR Tech Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Theme -->
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme !== 'light' && theme !== 'dark') theme = 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Glowminds — AI-Powered Career Platform for Students" />
    <meta property="og:description" content="Build ATS-optimized resumes, get AI-matched to 12,400+ daily jobs, and track applications — affordable plans for students and fresh graduates." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:site_name" content="Glowminds" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="Glowminds — AI-Powered Career Platform" />
    <meta name="twitter:description" content="Build ATS resumes, get AI-matched to 12,400+ daily jobs, and apply with one click. Affordable plans for students." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Glowminds",
      "url": "%SITE_URL%",
      "description": "AI-powered career platform for students and fresh graduates. Build resumes, find matched jobs, and track applications.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "52000",
        "bestRating": "5"
      },
      "creator": {
        "@type": "Organization",
        "name": "KNR Tech Solutions",
        "url": "%SITE_URL%"
      }
    }
    </script>

    <!-- Fonts (preconnect + load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@400;700&family=Roboto:wght@400;500;700&family=Volkhov:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to use Glowminds.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
