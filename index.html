<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (fallback before React hydrates) -->
    <title>Glowminds — Career OS to Land Your First Job, Anywhere</title>
    <meta name="description" content="Glowminds is a Career Operating System for students and early-career professionals worldwide — ATS resumes, global job matching, Glow (Bot), interviews, skills, cover letters, and tracking in one place so you can land the job. Free to start." />
    <meta name="keywords" content="career operating system, Glowminds, land a job, ATS resume, worldwide jobs, remote jobs, Glow (Bot), mock interviews, application tracker, student career OS" />
    <meta name="author" content="Glowminds" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Theme + critical paint (must not wait on Google Fonts / app CSS) -->
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html { background: #07090f; color: #f4f6fb; }
      html[data-theme="light"], html:not(.dark)[data-theme="light"] { background: #f7f8fb; color: #12141c; }
      body { margin: 0; min-height: 100%; }
      /* Branded first paint — never flash the raw SEO article as unstyled text */
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #07090f;
        color: #f4f6fb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html[data-theme="light"] #app-shell {
        background: #f7f8fb;
        color: #12141c;
      }
      #app-shell[hidden] { display: none !important; }
      #app-shell .app-shell-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      #app-shell img.app-shell-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        object-fit: contain;
        padding: 6px;
        box-sizing: border-box;
      }
      /* Match BrandLogo: light mark on dark bg, dark mark on light bg */
      #app-shell .app-shell-logo-light { display: none; }
      #app-shell .app-shell-logo-dark { display: block; }
      html[data-theme="light"] #app-shell .app-shell-logo-light { display: block; }
      html[data-theme="light"] #app-shell .app-shell-logo-dark { display: none; }
      #app-shell .app-shell-mark {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      /* Keep SEO HTML in the document for crawlers, but never paint it for users */
      #seo-boot {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      #seo-boot[hidden] { display: none !important; }
    </style>
    <script>
      (function () {
        // Host split + apex canonicalize. Never bounce localhost.
        try {
          var host = location.hostname;
          var rest = location.pathname + location.search + location.hash;
          var path = location.pathname || '/';
          var local = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0';
          var isApp = host === 'app.glowminds.in' || host === 'glowminds-app.web.app' || host === 'glowminds-app.firebaseapp.com';
          var appPrefixes = ['/login','/signup','/verify-email','/dashboard','/admin','/design','/jobs'];
          var mktPrefixes = ['/about','/features','/contact','/pricing','/careers','/privacy','/terms','/refund'];
          function starts(list) {
            for (var i = 0; i < list.length; i++) {
              if (path === list[i] || path.indexOf(list[i] + '/') === 0) return true;
            }
            return false;
          }
          if (!local) {
            if (!isApp && starts(appPrefixes)) {
              location.replace('%APP_URL%' + rest);
              return;
            }
            if (isApp && starts(mktPrefixes)) {
              location.replace('%SITE_URL%' + rest);
              return;
            }
            if (!isApp && (host === 'www.glowminds.in' || host === 'glowminds-abc84.web.app' || host === 'glowminds-abc84.firebaseapp.com')) {
              location.replace('%SITE_URL%' + rest);
              return;
            }
          }
        } catch (e) {}
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme !== 'light' && theme !== 'dark') theme = 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
