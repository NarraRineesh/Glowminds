<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (fallback before React hydrates) -->
    <title>Glowminds — AI Resume Builder, Job Matching & Upskilling for Freshers</title>
    <meta name="description" content="Build ATS-ready resumes, match to jobs, close skill gaps with AI upskilling paths, practice interviews, and track applications. Free to start for students and freshers in India." />
    <meta name="keywords" content="AI resume builder India, ATS resume for freshers, job search India, skill gap analysis, AI upskilling, learning path, AI interview prep, cover letter generator, application tracker, Glowminds" />
    <meta name="author" content="Glowminds" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Theme + critical paint (must not wait on Google Fonts / app CSS) -->
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html { background: #07090f; color: #f4f6fb; }
      html[data-theme="light"], html:not(.dark)[data-theme="light"] { background: #f7f8fb; color: #12141c; }
      body { margin: 0; min-height: 100%; }
      /* Branded first paint — never flash the raw SEO article as unstyled text */
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #07090f;
        color: #f4f6fb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html[data-theme="light"] #app-shell {
        background: #f7f8fb;
        color: #12141c;
      }
      #app-shell[hidden] { display: none !important; }
      #app-shell .app-shell-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      #app-shell img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      #app-shell .app-shell-mark {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      /* Keep SEO HTML in the document for crawlers, but never paint it for users */
      #seo-boot {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      #seo-boot[hidden] { display: none !important; }
    </style>
    <script>
      (function () {
        // Prefer apex host for SEO (Firebase www uses CDN 301; this covers *.web.app).
        try {
          var host = location.hostname;
          if (
            host === 'www.glowminds.in' ||
            host.endsWith('.web.app') ||
            host.endsWith('.firebaseapp.com')
          ) {
            location.replace('https://glowminds.in' + location.pathname + location.search + location.hash);
            return;
          }
        } catch (e) {}
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme !== 'light' && theme !== 'dark') theme = 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Glowminds — AI Resume Builder, Job Matching & Upskilling for Freshers" />
    <meta property="og:description" content="ATS resumes, AI job matching, skill-gap upskilling, mock interviews, and application tracking — free to start for students in India." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:alt" content="Glowminds — AI career platform for students and job seekers in India" />
    <meta property="og:site_name" content="Glowminds" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="Glowminds — AI Resume, Jobs & Upskilling" />
    <meta name="twitter:description" content="ATS resumes, AI job matching, skill-gap upskilling, mock interviews, and application tracking — free to start for students in India." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Glowminds — AI career platform for students and job seekers in India" />

    <!-- Structured Data (JSON-LD fallback) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%SITE_URL%/#organization",
          "name": "Glowminds",
          "legalName": "KNR Tech Solutions",
          "url": "%SITE_URL%",
          "logo": "%SITE_URL%/favicon/favicon-96x96.png",
          "email": "hello@glowminds.in"
        },
        {
          "@type": "WebSite",
          "@id": "%SITE_URL%/#website",
          "name": "Glowminds",
          "url": "%SITE_URL%",
          "publisher": { "@id": "%SITE_URL%/#organization" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Glowminds",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "%SITE_URL%",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          },
          "featureList": [
            "ATS resume builder",
            "AI job matching",
            "Skill gap analysis and upskilling paths",
            "AI mock interviews",
            "Cover letter generator",
            "Application tracker"
          ],
          "provider": { "@id": "%SITE_URL%/#organization" },
          "areaServed": { "@type": "Country", "name": "India" }
        }
      ]
    }
    </script>

    <!-- App fonts only (resume templates load their own). Non-blocking so FCP is not gated on fonts.googleapis.com -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Visible branded shell while CSS/JS boot (avoids unstyled SEO text FOUC) -->
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-inner">
        <img src="/favicon/favicon.svg" width="40" height="40" alt="" />
        <p class="app-shell-mark">Glowminds</p>
      </div>
    </div>
    <!-- Crawlable copy (visually hidden; outside #root so React never erases it) -->
    <div id="seo-boot"></div>
    <noscript id="seo-noscript">
      <main>
        <h1>Glowminds — AI Resume Builder, Job Matching &amp; Upskilling for Freshers in India</h1>
        <p>
          Build ATS-ready resumes, discover matched jobs, close skill gaps with AI learning paths,
          practice interviews, generate cover letters, and track applications — free to start.
        </p>
        <nav>
          <ul>
            <li><a href="/features">Features</a></li>
            <li><a href="/pricing">Pricing</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/signup">Sign up free</a></li>
          </ul>
        </nav>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
