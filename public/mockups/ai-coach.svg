<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="16" y="16" width="928" height="48" rx="10" fill="#161b22" stroke="rgba(56,139,253,.08)" stroke-width="1"/>
  <circle cx="48" cy="40" r="14" fill="url(#gc)"/><text x="48" y="45" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">🤖</text>
  <defs><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#388bfd"/><stop offset="100%" stop-color="#3fb950"/></linearGradient></defs>
  <text x="72" y="46" font-family="sans-serif" font-size="13" fill="#e6edf3" font-weight="700">AI Career Coach</text>
  <circle cx="180" cy="40" r="4" fill="#3fb950"/><text x="192" y="44" font-family="sans-serif" font-size="10" fill="#3fb950">Online</text>
  <rect x="32" y="84" width="460" height="72" rx="12" fill="#161b22" stroke="rgba(56,139,253,.06)" stroke-width="1"/>
  <text x="48" y="108" font-family="sans-serif" font-size="12" fill="#8b949e">For your Google behavioral round, use the</text>
  <text x="48" y="126" font-family="sans-serif" font-size="12" fill="#8b949e">STAR method: Situation, Task, Action, Result.</text>
  <text x="48" y="144" font-family="sans-serif" font-size="12" fill="#8b949e">Let me help you structure your answer...</text>
  <rect x="540" y="174" width="396" height="44" rx="12" fill="rgba(56,139,253,.1)" stroke="rgba(56,139,253,.2)" stroke-width="1"/>
  <text x="892" y="200" font-family="sans-serif" font-size="12" fill="#58a6ff" text-anchor="end">How should I prepare for system design?</text>
  <rect x="32" y="236" width="540" height="120" rx="12" fill="#161b22" stroke="rgba(56,139,253,.06)" stroke-width="1"/>
  <text x="48" y="264" font-family="sans-serif" font-size="12" fill="#8b949e">Great question! Here's a system design prep plan:</text>
  <text x="48" y="286" font-family="sans-serif" font-size="12" fill="#e6edf3" font-weight="600">1. Learn fundamentals (CAP, load balancing)</text>
  <text x="48" y="306" font-family="sans-serif" font-size="12" fill="#e6edf3" font-weight="600">2. Practice designing: URL shortener, chat app</text>
  <text x="48" y="326" font-family="sans-serif" font-size="12" fill="#e6edf3" font-weight="600">3. Focus on trade-offs and scalability</text>
  <rect x="32" y="374" width="896" height="36" rx="8" fill="#161b22"/>
  <text x="48" y="396" font-family="sans-serif" font-size="12" fill="#4a5568">💡 Suggestions:</text>
  <rect x="140" y="378" width="140" height="28" rx="14" fill="rgba(56,139,253,.08)"/><text x="210" y="396" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Resume review</text>
  <rect x="292" y="378" width="160" height="28" rx="14" fill="rgba(56,139,253,.08)"/><text x="372" y="396" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Salary negotiation</text>
  <rect x="464" y="378" width="130" height="28" rx="14" fill="rgba(56,139,253,.08)"/><text x="529" y="396" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Cold outreach</text>
  <rect x="32" y="428" width="896" height="48" rx="10" fill="#161b22" stroke="rgba(56,139,253,.08)" stroke-width="1"/>
  <text x="48" y="458" font-family="sans-serif" font-size="12" fill="#4a5568">Type your message...</text>
  <rect x="860" y="438" width="52" height="28" rx="6" fill="#388bfd"/><text x="886" y="456" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">Send</text>
</svg>
